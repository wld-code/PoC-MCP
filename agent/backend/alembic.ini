[alembic]
# Resolved relative to the CWD alembic is invoked from — always run this from
# agent/ (e.g. `alembic -c backend/alembic.ini upgrade head`), which is what
# the Docker entrypoint (agent/entrypoint.sh) does.
script_location = backend/alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted — backend/alembic/env.py reads it
# from Settings (DATABASE_URL env var) so one config works in every environment.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
