# UI agent — long-running web chat service (Deployment + Service).
# Reads the LLM key from the llm-secrets Secret (see secret.example.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-web
  namespace: mcp-poc
spec:
  replicas: 1                      # one MCP session per pod; scale with care
  selector:
    matchLabels:
      app: agent-web
  template:
    metadata:
      labels:
        app: agent-web
    spec:
      containers:
        - name: agent-web
          image: mcp-poc/agent:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "web:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          env:
            - name: MCP_SERVER_URL
              value: http://mcp-server:8001/mcp
            - name: LLM_PROVIDER
              value: claude
          envFrom:
            - secretRef:
                name: llm-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-web
  namespace: mcp-poc
spec:
  selector:
    app: agent-web
  ports:
    - port: 8002
      targetPort: 8002
