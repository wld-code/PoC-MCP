# FastAPI data service: PVC for the SQLite file + Deployment + ClusterIP Service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
  namespace: mcp-poc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mcp-poc
spec:
  replicas: 1                      # SQLite + RWO volume => single writer
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: mcp-poc/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: /data/data.db
            - name: AUTO_SEED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mcp-poc
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
