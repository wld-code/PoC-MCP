# Copy to secret.yaml, fill in the key for your provider, and apply.
# DO NOT commit the filled-in version.
#
#   kubectl apply -f k8s/secret.yaml
#
# Or create it imperatively without a file:
#   kubectl -n mcp-poc create secret generic llm-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
  namespace: mcp-poc
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-replace-me"
  # OPENAI_API_KEY: "sk-..."
  # MISTRAL_API_KEY: "..."
