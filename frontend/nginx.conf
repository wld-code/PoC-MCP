server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — any non-file path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend service — the SPA only ever calls
    # relative /api/... paths, in dev (vite proxy) and in prod (this) alike.
    location /api/ {
        proxy_pass http://backend:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/auth /api/auth;
    }
}
