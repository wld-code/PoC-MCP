name: CI

# Runs the end-to-end test suite on every push and pull request, plus a
# frontend build check. The Python tests use the deterministic `mock`
# provider and a throwaway SQLite DB, so they need no API key, no Postgres,
# and cost nothing — CI boots all four real APIs + four MCP servers + the
# backend API and drives every layer (APIs -> MCP -> headless agent ->
# backend: auth/RBAC, chat, scheduler).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r asap_api/requirements.txt \
                      -r cvc_api/requirements.txt \
                      -r redbend_api/requirements.txt \
                      -r datalake_api/requirements.txt \
                      -r asap_mcp/requirements.txt \
                      -r cvc_mcp/requirements.txt \
                      -r redbend_mcp/requirements.txt \
                      -r datalake_mcp/requirements.txt \
                      -r agent/requirements.txt \
                      -r tests/requirements.txt

      - name: Run end-to-end tests
        env:
          LLM_PROVIDER: mock
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (typecheck + bundle)
        working-directory: frontend
        run: npm run build
