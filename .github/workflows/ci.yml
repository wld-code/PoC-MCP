name: CI

# Runs the end-to-end test suite on every push and pull request.
# The tests use the deterministic `mock` provider, so they need no API key
# and cost nothing — CI boots the real API + MCP server and drives every layer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt \
                      -r mcp_server/requirements.txt \
                      -r agent/requirements.txt \
                      -r tests/requirements.txt

      - name: Run end-to-end tests
        env:
          LLM_PROVIDER: mock
        run: pytest -v
